<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="vf-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <linearGradient id="vf-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="vf-amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="vf-shield-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="vf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cybernetic Hex Shield Base -->
  <rect width="128" height="128" rx="28" fill="url(#vf-bg-grad)" stroke="#0e3a5a" stroke-width="2" />

  <!-- Outer Circuit Grid Traces -->
  <path d="M16 44 L30 44 L38 52 M112 44 L98 44 L90 52 M16 84 L30 84 L38 76 M112 84 L98 84 L90 76" stroke="#0e4a6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="16" cy="44" r="2.5" fill="#0284c7" />
  <circle cx="112" cy="44" r="2.5" fill="#0284c7" />
  <circle cx="16" cy="84" r="2.5" fill="#0284c7" />
  <circle cx="112" cy="84" r="2.5" fill="#0284c7" />

  <!-- Outer HUD Corner Reticles -->
  <path d="M34 26 L22 26 L22 38 M94 26 L106 26 L106 38 M34 102 L22 102 L22 90 M94 102 L106 102 L106 90" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cyber Forge Hexagonal Core Shield -->
  <path d="M64 18 L96 36 L96 74 L64 110 L32 74 L32 36 Z" fill="#081b33" fill-opacity="0.9" stroke="url(#vf-shield-stroke)" stroke-width="3" stroke-linejoin="round" filter="url(#vf-glow)" />

  <!-- Inner Reticle Crosshairs -->
  <line x1="64" y1="26" x2="64" y2="44" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <line x1="64" y1="84" x2="64" y2="102" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <line x1="38" y1="64" x2="52" y2="64" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <line x1="76" y1="64" x2="90" y2="64" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.85" />

  <!-- Center Diamond Aperture / Laser Eye -->
  <polygon points="64,46 80,64 64,82 48,64" fill="url(#vf-cyan-grad)" opacity="0.25" stroke="#22d3ee" stroke-width="1.5" />
  <polygon points="64,52 74,64 64,76 54,64" fill="url(#vf-cyan-grad)" />
  <circle cx="64" cy="64" r="3.5" fill="#ffffff" filter="url(#vf-glow)" />

  <!-- Solder Node Accent Points -->
  <circle cx="64" cy="18" r="3" fill="url(#vf-amber-grad)" />
  <circle cx="96" cy="36" r="3" fill="#38bdf8" />
  <circle cx="96" cy="74" r="3" fill="#38bdf8" />
  <circle cx="64" cy="110" r="3" fill="url(#vf-amber-grad)" />
  <circle cx="32" cy="74" r="3" fill="#38bdf8" />
  <circle cx="32" cy="36" r="3" fill="#38bdf8" />
</svg>
