name: VisionForge CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. FRONTEND: Lint & Production Bundle Build
  # ────────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend (Build & Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Oxlint (Frontend Linter)
        run: npm run lint

      - name: Build Production Frontend (Vite)
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # 2. BACKEND: Environment, App Initialization & Test Suite
  # ────────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend (Build, Init & 214 Test Suite)
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: backend
      ENVIRONMENT: test
      DEBUG: "true"
      DATABASE_URL: "sqlite+aiosqlite:///data/visionforge_test.db"
      JWT_SECRET_KEY: "ci-test-secret-key-must-be-at-least-32-chars-long"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Libraries for OpenCV & Vision
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install PyTorch CPU & Backend Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install CPU wheels first to prevent downloading heavy 2.5GB+ CUDA binaries in CI
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt

      - name: Setup Test Environment File
        run: |
          cp backend/.env.example backend/.env
          mkdir -p backend/data/inspection_uploads backend/data/golden_references

      - name: Verify Backend App Initialization & Route Assembly
        run: |
          python -c "from app.main import app; print('✓ FastAPI App and all Routers Initialized Successfully')"

      - name: Run Pytest Test Suite
        run: |
          python -m pytest backend/tests -v --durations=10
